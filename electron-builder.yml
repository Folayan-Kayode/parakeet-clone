appId: com.davel.parakeetclone
productName: Parakeet Clone
directories:
  output: dist
files:
  - out/**/*
  - package.json
afterPack: scripts/after-pack.js
# Artifacts attach to GitHub Releases only when dist is run with GH_TOKEN and
# --publish; the generic-feed autoUpdater flow is unchanged.
publish:
  provider: github
  owner: Folayan-Kayode
  repo: parakeet-clone
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
